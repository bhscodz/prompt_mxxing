# File: docker-compose.yml
# Description: Multi-container orchestration for PostgreSQL, FastAPI Backend, and Vite Frontend

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: swasthya_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-swasthya_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swasthya_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/swasthya_db
      DEFAULT_DISTRICT: "Pune Rural & Western Ghats"
      DEFAULT_STATE: "Maharashtra"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swasthya_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:

